<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HVEAC Control Center - Environmental AI Operations Dashboard">
  <title>HVEAC | Control Center</title>
  <link rel="stylesheet" href="css/style.css?v=1.1">
</head>
<body>
  <div id="app" class="app-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1 class="sidebar-logo">HVEAC</h1>
        <div class="sidebar-sub">ENVIRONMENTAL AI</div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <a href="#/" class="nav-item" data-route="#/">
          <span class="nav-label">OVERVIEW</span>
        </a>
        <a href="#/occupancy" class="nav-item" data-route="#/occupancy">
          <span class="nav-label">OCCUPANCY</span>
        </a>
        <a href="#/nodes" class="nav-item" data-route="#/nodes">
          <span class="nav-label">COMPUTER NODES</span>
        </a>
        <a href="#/environment" class="nav-item" data-route="#/environment">
          <span class="nav-label">ENVIRONMENT</span>
        </a>
        <a href="#/simulation" class="nav-item" data-route="#/simulation">
          <span class="nav-label">SIMULATION</span>
          <span class="nav-badge nav-badge-lab">LAB</span>
        </a>

        <div class="nav-section-header">FUTURE</div>
        <a href="#/thermal" class="nav-item nav-item-future" data-route="#/thermal">
          <span class="nav-label">THERMAL INTELLIGENCE</span>
          <span class="nav-badge">PLANNED</span>
        </a>
        <a href="#/hvac" class="nav-item nav-item-future" data-route="#/hvac">
          <span class="nav-label">HVAC OPTIMIZATION</span>
          <span class="nav-badge">PLANNED</span>
        </a>

        <div class="nav-section-header">SYSTEM</div>
        <a href="#/analytics" class="nav-item" data-route="#/analytics">
          <span class="nav-label">ANALYTICS</span>
        </a>
        <a href="#/control" class="nav-item" data-route="#/control">
          <span class="nav-label">CONTROL CENTER</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <span class="location-icon">📍</span>
        <span class="location-text">Vandalur, Chennai</span>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <header class="top-header" id="top-header">
        <div class="header-left">
          <h2 class="page-title" id="page-title">OVERVIEW</h2>
        </div>
        <div class="header-right">
          <div class="system-status-indicator" id="system-status-indicator">
            <span class="status-dot status-dot-offline" id="status-dot"></span>
            <span class="status-text" id="status-text">SYSTEM OFFLINE</span>
          </div>
        </div>
      </header>

      <main class="main-content" id="main-content">
        <!-- Dynamic views loaded by SPA Router -->
      </main>
    </div>
  </div>

  <!-- Vanilla ES6 Architecture -->
  <script src="js/state.js?v=1.1"></script>
  <script src="js/components.js?v=1.1"></script>
  <script src="js/sim_visuals.js?v=1.1"></script>
  <script src="js/pages.js?v=1.1"></script>
  <script src="js/app.js?v=1.1"></script>
</body>
</html>
